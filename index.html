<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pesquisa Culturama</title>
  </head>
  <body>
    <header>
      <h1>Pesquisa Online</h1>
      <form action="" method="get">
        <!-- DADOS PESSOAIS  -->

        <legend>Dados Pessoais</legend>
        <label for="userName">Nome:</label>
        <input type="text" name="userName" required /><br />

        <label for="userAge">Idade:</label>
        <input type="number" name="userAge" min="12" max="100" required /><br />

        <label for="userBirthDate">Data de Nascimento:</label>
        <input type="date" name="userBirthDate" /><br />

        <label for="userEmail">Email</label>
        <input type="email" name="userEmail" required /><br />

        <label for="userPhoneNumber">Telefone:</label>
        <input
          type="tel"
          name="userPhoneNumber"
          pattern="[0-9]{11}"
          placeholder="ex: (DDD)+numbers "
        />
        <br />
        <fieldset>
          <label for="userUploadImage">Imagem:</label>
          <input type="file" accept="image/*" name="userUploadImage" /> <br />
        </fieldset>
        <fieldset>
          <legend>Perfil</legend>
          <p>Gênero:</p>
          <input type="radio" name="userGender" value="feminino" />
          <label for="userGender">Feminino</label>
          <input type="radio" name="userGender" value="Masculino" />
          <label for="userGender">Masculino</label>
          <input type="radio" name="userGender" value="notInformed" />
          <label for="userGender">Prefiro não informar</label> <br />

          <label for="userMaritalStatus">Estado Civil</label>
          <select name="userMaritalStatus">
            <option value="notSelect">Selecione:</option>
            <option value="solteiro">Solteiro(a)</option>
            <option value="casado">Casado(a)</option>
            <option value="divorciado">Divorciado(a)</option>
            <option value="separado">Separado(a)</option>
            <option value="viuvo">Viúvo(a)</option>
          </select>

          <label for="useState">Estado:</label>
          <select name="userState" required>
            <option value="acre">Acre</option>
            <option value="lagoas">lagoas</option>
            <option value="amapa">Amapá</option>
            <option value="amazonas">Amazonas</option>
            <option value="bahia">Bahia</option>
            <option value="ceara">Ceará</option>
            <option value="distritoFederal">Distrito Federal</option>
            <option value="espiritoSanto">Espírito Santo</option>
            <option value="goias">Goiás</option>
            <option value="maranhao">Maranhão</option>
            <option value="matoGrosso">Mato Grosso</option>
            <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
            <option value="minasGerais">Minas Gerais</option>
            <option value="para">Pará</option>
            <option value="paraiba">Paraíba</option>
            <option value="parana">Paraná</option>
            <option value="pernambuco">Pernambuco</option>
            <option value="piaui">Piauí</option>
            <option value="rioDeJaneiro">Rio de Janeiro</option>
            <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
            <option value="rioGrandeDoSul">Rio Grande do Sul</option>
            <option value="rondonia">Rondônia</option>
            <option value="roraima">Roraima</option>
            <option value="santaCatarina">Santa Catarina</option>
            <option value="saoPaulo">São Paulo</option>
            <option value="sergipe">Sergipe</option>
            <option value="tocantis">Tocantins</option>
          </select>
          <label for="userCity">Cidade:</label>
          <input
            type="text"
            id="userCity"
            autocomplete="address-level2"
            placeholder="Ex.:Frotaleza"
          />
        </fieldset>
        <fieldset>
          <legend>Hábitos</legend>
          <p>Redes sociais</p>
          <input type="checkbox" value="instagram" name="social" />
          <label for="social ">Instagram</label> <br />
          <input type="checkbox" value="youtube" name="social" />
          <label for="social">Youtube</label> <br />
          <input type="checkbox" value="facebook" name="social" />
          <label for="social ">Facebook</label> <br />
          <input type="checkbox" value="x" name="social" />
          <label for="social">X</label>
        </fieldset>
        <button type="submit">Enviar</button>
      </form>
    </header>
  </body>
</html>
